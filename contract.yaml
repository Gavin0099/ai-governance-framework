name: ai-governance-framework-contract
plugin_version: "1.0.0"
framework_interface_version: "1"
framework_compatible: ">=1.0.0,<2.0.0"
domain: ai-governance
documents:
  - AGENTS.base.md
  - PLAN.md
ai_behavior_override:
  - AGENTS.base.md
rule_roots:
  - governance/rules
validators:
  - governance_tools/architecture_drift_checker.py
# Repo-relative directories that may hold test evidence. Consumer declarations
# are additive: `artifacts` is framework-owned and always accepted, so listing
# it here is documentation rather than configuration. Repos that store receipts
# elsewhere add their own roots to this list.
evidence_roots:
  - artifacts
